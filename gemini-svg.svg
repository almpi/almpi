<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Abstract Paper / Layers Icon representing Papers & Growth -->
  <g transform="translate(110, 105)">
    <!-- Back Paper Sheet -->
    <path d="M 60 20 L 232 20 C 248.5 20, 262 33.5, 262 50 L 262 250 C 262 266.5, 248.5 280, 232 280 L 60 280 C 43.5 280, 30 266.5, 30 250 L 30 50 C 30 33.5, 43.5 20, 60 20 Z" 
          fill="#334155" opacity="0.6" transform="translate(20, -15)" />

    <!-- Middle Paper Sheet -->
    <path d="M 60 20 L 232 20 C 248.5 20, 262 33.5, 262 50 L 262 250 C 262 266.5, 248.5 280, 232 280 L 60 280 C 43.5 280, 30 266.5, 30 250 L 30 50 C 30 33.5, 43.5 20, 60 20 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="4" transform="translate(10, -8)" />

    <!-- Main Front Document / Paper -->
    <path d="M 60 20 L 232 20 C 248.5 20, 262 33.5, 262 50 L 262 250 C 262 266.5, 248.5 280, 232 280 L 60 280 C 43.5 280, 30 266.5, 30 250 L 30 50 C 30 33.5, 43.5 20, 60 20 Z" 
          fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />

    <!-- Skill / Upward Growth Checkmark & Graph Line -->
    <path d="M 75 180 L 125 210 L 210 100" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Document Lines (Text placeholders) -->
    <rect x="75" y="60" width="110" height="12" rx="6" fill="#64748b" opacity="0.5" />
    <rect x="75" y="85" width="70" height="10" rx="5" fill="#64748b" opacity="0.3" />
  </g>

  <!-- Typography Element (ALMPi) -->
  <text x="256" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="4" text-anchor="middle">ALMPi</text>
</svg>
